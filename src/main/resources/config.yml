# ===== RaskolGear: оружие и броня классов =====

rarity:
  COMMON:
    color: "&f"
    multiplier: 1.0
  RARE:
    color: "&9"
    multiplier: 1.5
  EPIC:
    color: "&5"
    multiplier: 2.5
  LEGENDARY:
    color: "&6"
    multiplier: 4.0

# ===== Крафт =====
# Рецепт: чертёж в центр + 8 фрагментов вокруг (верстак 3x3)
# Чертежи LEGENDARY уникальны под каждый сет (ключ сета в PDC чертежа)
crafting:
  fragments-required: 8
  tier-by-rarity:
    COMMON: iron
    RARE: steel
    EPIC: mithril
    LEGENDARY: mithril   # легендарный крафтится как эпический
  success-chance:
    COMMON: 90.0
    RARE: 70.0
    EPIC: 50.0
    LEGENDARY: 50.0

# ===== Бой =====
combat:
  crit-multiplier: 2.0
  bleed-damage-per-sec: 2.0
  proc-heal: 6.0
  warn-cooldown-seconds: 3
  debug: true
  damage-multiplier: 0.35
  max-single-hit: 300.0
  max-single-hit-pvp: 200.0

